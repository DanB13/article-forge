name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-bdd pyyaml
      - name: Every spec scenario has a test
        run: python tools/check_specs.py
      - name: Code scenarios (pytest-bdd)
        run: pytest -q -rs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Skill and plugin manifest are valid
        run: npx -y @anthropic-ai/claude-code plugin validate .claude/skills/article-forge
