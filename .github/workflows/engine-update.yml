name: engine-update

# Runs in YOUR copy of article-forge (made from the template), never upstream.
# Every Monday it checks the upstream engine for a newer release. If there is
# one, it merges it on a branch and opens a pull request for you to review.
# Merge that pull request with "Create a merge commit", never squash.
#
# One-time setup in your repo (python .claude/skills/article-forge/scripts/check_setup.py checks it):
#   1. Settings > Actions > General > Workflow permissions:
#      tick "Allow GitHub Actions to create and approve pull requests".
#   2. Updates that change files under .github/workflows/ need a fine-grained
#      token with Contents and Workflows (read and write) on this repo, saved as
#      the ENGINE_UPDATE_TOKEN secret. The token only pushes the update branch;
#      this workflow's own token opens the pull request.
#   3. Optional: set the repository variable ENGINE_CHANNEL to "rc" to receive
#      release candidates as well as final releases.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    if: github.repository != 'DanB13/article-forge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ENGINE_UPDATE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge the newest engine release on a branch
        id: update
        env:
          UPSTREAM: ${{ vars.ARTICLE_FORGE_UPSTREAM || 'https://github.com/DanB13/article-forge.git' }}
          CHANNEL: ${{ vars.ENGINE_CHANNEL || 'release' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "article-forge engine update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/engine_update.py --upstream "$UPSTREAM" --channel "$CHANNEL" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      # REST, not `gh pr create`: GitHub's GraphQL createPullRequest has refused both
      # a fine-grained token and the workflow token in practice (specs 014-06, 014-07).
      - name: Open pull request
        id: pr
        if: steps.update.outputs.action == 'open_pr'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls" \
            -f base="${{ github.event.repository.default_branch }}" \
            -f head="${{ steps.update.outputs.branch }}" \
            -f title="Engine update: article-forge ${{ steps.update.outputs.tag }}" \
            -F body=@"$RUNNER_TEMP/pr-body.md" --jq .html_url

      - name: If the pull request could not be opened, open an issue with a link
        if: steps.pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.update.outputs.branch }}
          TAG: ${{ steps.update.outputs.tag }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          link="${{ github.server_url }}/${{ github.repository }}/compare/${BASE}...${BRANCH}?expand=1"
          printf 'The engine update %s is merged on the branch %s, but GitHub would not let this workflow open the pull request.\n\nOpen it in one click: %s\n\nThen merge it with **Create a merge commit**. If this keeps happening, run .claude/skills/article-forge/scripts/check_setup.py.\n' \
            "$TAG" "$BRANCH" "$link" > "$RUNNER_TEMP/issue.md"
          gh issue create --title "Engine update $TAG is ready: open its pull request" --body-file "$RUNNER_TEMP/issue.md"
          echo "::error::Could not open the pull request. An issue with a one-click link was opened instead."
          exit 1

      - name: Report a conflict or a refused update
        if: steps.update.outputs.action == 'conflict' || steps.update.outputs.action == 'refused'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.update.outputs.action }}
          TAG: ${{ steps.update.outputs.tag }}
          FILES: ${{ steps.update.outputs.files }}
        run: |
          if [ "$ACTION" = "refused" ]; then
            title="Engine update $TAG was refused: it would change your own files"
            why="The update would change these files in profile/ or articles/, which belong to you. Nothing was pushed. Please report this upstream."
          else
            title="Engine update $TAG needs a manual merge"
            why="The automatic merge stopped on these files. Run locally: git fetch upstream --tags && git merge $TAG, keep your own version of anything in profile/ or articles/, then push. Claude Code can do this for you."
          fi
          printf '%s\n\n%s\n' "$why" "$FILES" > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
