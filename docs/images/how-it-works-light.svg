<text x="664" y="240" font-size="12.5" fill="#59636e">proposed; you approve each</text>
<rect x="0.5" y="362.5" width="879" height="40" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/>
<text x="18" y="385" font-size="14" font-weight="700" fill="#1f2328">Your profile</text>
<text x="116" y="385" font-size="12.5" fill="#59636e">voice, context, writing samples, settings</text>
<text x="862" y="385" text-anchor="end" font-size="12.5" fill="#7d4e00">0 Onboarding builds it from your own writing</text>
<line x1="134.0" y1="360" x2="134.0" y2="320" stroke="#d4a72c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<line x1="440.0" y1="360" x2="440.0" y2="320" stroke="#d4a72c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<text x="144.0" y="344" font-size="12" fill="#7d4e00">read before every phase</text>
<line x1="746.0" y1="320" x2="746.0" y2="360" stroke="#d4a72c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<text x="736.0" y="344" text-anchor="end" font-size="12" fill="#7d4e00">learns from what you changed</text>
