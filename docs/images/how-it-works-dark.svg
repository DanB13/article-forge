<circle cx="336" cy="275" r="10" fill="#102a46" stroke="#4493f8" stroke-width="1.5"/>
<text x="336" y="279.5" text-anchor="middle" font-size="12" font-weight="700" fill="#4493f8">7</text>
<text x="358" y="274" font-size="14" font-weight="600" fill="#f0f6fc">Publish pack</text>
<text x="358" y="292" font-size="12.5" fill="#9198a1">ready for the platform</text>
