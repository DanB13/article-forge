<text x="664" y="188" font-size="12.5" fill="#9198a1">what you changed, and how much</text>
<rect x="628" y="213" width="28" height="20" rx="10" fill="#3fb950"/>
<text x="642" y="227" text-anchor="middle" font-size="10.5" font-weight="700" fill="#151b23">YOU</text>
<text x="664" y="222" font-size="14" font-weight="600" fill="#f0f6fc">Profile updates</text>
<text x="664" y="240" font-size="12.5" fill="#9198a1">proposed; you approve each</text>
<rect x="0.5" y="362.5" width="879" height="40" rx="10" fill="#2e2a10" stroke="#bb8009" stroke-width="1.2"/>
<text x="18" y="385" font-size="14" font-weight="700" fill="#f0f6fc">Your profile</text>
<text x="116" y="385" font-size="12.5" fill="#9198a1">voice, context, writing samples, settings</text>
<text x="862" y="385" text-anchor="end" font-size="12.5" fill="#e3b341">0 Onboarding builds it from your own writing</text>
<line x1="134.0" y1="360" x2="134.0" y2="320" stroke="#bb8009" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<line x1="440.0" y1="360" x2="440.0" y2="320" stroke="#bb8009" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<text x="144.0" y="344" font-size="12" fill="#e3b341">read before every phase</text>
<line x1="746.0" y1="320" x2="746.0" y2="360" stroke="#bb8009" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<text x="736.0" y="344" text-anchor="end" font-size="12" fill="#e3b341">learns from what you changed</text>
