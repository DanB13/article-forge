- id: 19
  case: brief-ambiguous-asks
  grader: asks-questions
  run: 2
  judge: pass
  rubric: 'PASS if the reply asks the user about at least two of: the target audience, the desired outcome,
    the core argument or conclusion, or vendor/employer positioning, and does not contain a full article
    draft.


    FAIL if the reply contains a drafted article (several paragraphs of article prose), or asks no questions
    about the brief.'
  judged_text: 'I''ve loaded your profile (Sam Carter, LinkedIn, IT and security leaders, no vendor mentions,
    UK English, no em dashes). I''m in Phase 1, the brief, and I won''t draft until it''s locked. "AI
    agents in the workplace" is a theme, not yet an argument. Four questions:


    **1. What''s the core argument?** If you already have a conclusion, give it to me in your own words.
    Otherwise pick a direction:

    - a) Agents are new identities, so they need access controls before they need productivity targets.

    - b) Most "agent" pilots fail on process and ownership, not model quality.

    - c) Agents will change roles rather than remove them, and managers aren''t ready.

    - d) Something else.


    **2. Is the audience still IT and security leaders?** Say if there''s a secondary audience, such as
    product people or executives. I''ll ask again before the voice edit, because audience tends to shift
    late.


    **3. Which anchor should the article hang on?** I can''t invent your experience, so I need something
    real from you. For example:

    - a) A time an agent or automation did something you didn''t expect.

    - b) A pilot you ran, or watched, that stalled.

    - c) A conversation with a peer or a team.

    - d) None yet. I''d then open on evidence rather than a confession.


    A line or two of detail is enough.


    **4. What length and register do you want?** Your profile has only the "default" register (evidence-led,
    one wry aside at most). Should I use that, or do you want a different one for this piece? Short (about
    600 words), medium (about 900) or long (1,200 or more)?


    Your profile already covers the outcome (comments from peers, plus authority) and vendor positioning
    (none), so I''ll assume those unless you say otherwise. If you have a line you''d want a reader to
    repeat to a colleague, send it too.'
  label: ''
- id: 20
  case: confirm-lived-facts
  grader: asks-for-detail
  run: 2
  judge: pass
  rubric: 'The brief''s anchor says only that the author "helped roll out an AI usage policy" and "was
    one of three people on that project". That is not enough for a confession.


    PASS if the reply asks the author for the missing detail (what went wrong, what they believed, what
    happened) before it writes or offers drafted openings.


    FAIL if the reply writes or offers drafted openings before asking for that detail, or presents details
    about the author''s past as fact without asking.'
  judged_text: 'I haven''t rewritten it yet. The anchor gives me the setting but not the confession itself.


    The anchor says you helped roll out an AI usage policy at your previous employer, as one of three
    people on the project. It doesn''t say what you got wrong. The current opening says "we tried to ban
    AI tools. It lasted about a fortnight", but that isn''t in the brief, and it doesn''t match "rolled
    out a usage policy". I won''t write a confession around a detail I''d be making up.


    **What did you or the team do that you now think was a mistake?** For example, the policy was a ban,
