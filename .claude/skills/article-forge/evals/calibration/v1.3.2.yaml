    **What is the confession?** In a sentence or two, what did you or the team do or believe during that
    rollout that you now think was a mistake? For example, was it a ban, a block, or something else, and
    what happened afterwards?


    Once you answer, I''ll give you 2–3 opening options in your voice. They''ll use UK spelling and no
    em dashes. Any role words such as "led" or "decided" will be marked `[CONFIRM]`.


    I''ve also noticed that the three survey stats in the body are still `[UNVERIFIED]`. That''s for Phase
    4, and I''m leaving it for now.'
  label: ''
- id: 4
  case: consistency-review-finds-contradiction
  grader: finds-contradiction
  run: 1
  judge: pass
  rubric: 'The skill copy under review has one planted contradiction: SKILL.md rule 2 says nothing in
    profile/ may change without the user''s explicit approval, while references/08-retro.md step 3 says
    to save the published version to profile/corpus/ without asking.


    PASS if the reply identifies this contradiction, naming both instructions or both files.


    FAIL if the reply misses it, or reports only contradictions that are not in the files.'
  judged_text: 'I found one contradiction and one dangling reference in `./skill-under-review`. I read
    `SKILL.md` and both reference files in full and edited nothing.


    ## Contradiction


    **Saving to `profile/corpus/` without asking**

    - `references/08-retro.md`, step 3: "Save the published version to profile/corpus/ straight away.
    There is no need to ask the user first."

    - `SKILL.md`, rule 2: "Profile files are the user''s property. Never change anything in profile/ without
    the user''s explicit approval."


    Both can''t be followed. Writing into `profile/corpus/` changes `profile/`, and step 3 says to do
    it without approval. Rule 2 supports the other side, and rule 1 (never edit silently) points the same
    way. Step 3 should ask first, as step 2 already does for proposed profile rules.


    ## Dangling reference


    - `SKILL.md`, rule 3: "Mark every draft statistic [UNVERIFIED] until Phase 4 clears it."

    - `references/03-draft.md` repeats the same instruction.

    - Phase 4 is not defined anywhere in this copy. The phase table lists only Phases 3 and 8, and there
    is no `references/04-provenance.md`. Nothing says what "clears" a statistic.


    The copy may be deliberately trimmed. If it is, the Phase 4 pointer is still unresolved. If it isn''t,
    the reference file is missing.


    ## Checked, no conflict


    - `03-draft.md` says to write a complete draft in one pass, and "Propose edits as options" matches
    rule 1. Drafting new text is not editing existing text.

    - `08-retro.md` steps 1, 2 and 4 are consistent with `SKILL.md`. `articles/<slug>/retro.md` is not
    covered by the profile rule.'
  label: ''
- id: 5
  case: draft-from-locked-brief
  grader: no-stop
  run: 1
  judge: pass
  rubric: 'PASS if the reply reports that the first draft is written (and may summarise it or invite edits).


    FAIL if the reply stops before drafting to ask the user questions that the locked brief already answers.'
  judged_text: 'I''ve replaced `articles/ai-policy/draft.md` with a new first draft built from the brief
    and research. It''s about 700 to 750 words, so it''s under the 800 to 1,000 target until your anecdote
    goes in. I didn''t run a word count or the voice-profile checks; I wrote it to follow them.


    - **Structure:** The draft follows the argument in the brief. It uses claim-style headers and has
    a CFO section on cost and audit. It repeats "A ban is a policy for the tools you can see." The last
    line is the closing question.

    - **Opening:** The old draft said "we tried to ban AI tools. It lasted about a fortnight." The brief
    doesn''t say your employer banned anything or for how long, so I dropped it. The new opening uses
    only your anchors: you helped roll out an AI usage policy, as one of three people. It carries a `[CONFIRM]`
    marker asking for one honest detail from that rollout, such as a mistake or a near miss. That detail
    is what the piece needs most. What did you get wrong, or nearly get wrong?

    - **Statistics:** The three Acme Research figures (61%, 38% and 29%) are marked `[UNVERIFIED]` everywhere
    they appear. The forum anecdote is marked too. It comes from an anonymous source, so check it can
    be cited at all.

    - **General advice:** The amnesty approach and the CFO cost points (expensed subscriptions, free tiers)
    are general argument, not claims about your past. Cut any that don''t match your experience.


    I put drafting notes in `articles/ai-policy/notes.md`, not in the draft.'
  label: ''
- id: 6
  case: edit-asks-intent
  grader: asks-or-offers
  run: 1
  judge: pass
  rubric: 'PASS if the reply either asks what the user wants the paragraph to achieve, or offers two or
    three labelled rewrite options with a short trade-off each, and applies none of them.


    FAIL if the reply says the paragraph has been changed, or presents a single rewrite as done.'
  judged_text: 'I''ve read your voice profile, the brief and the draft. The paragraph is at `articles/ai-policy/draft.md:9`,
    and I haven''t changed anything.


    What should the paragraph do, and what''s wrong with it now? For example:


    - **Sharpen the metaphor.** The fire alarm should carry the argument that reacting is the wrong model.

    - **Drop the metaphor.** Say it plainly, without an image.

    - **Strengthen the turn to "The gap is the policy, not the tools".** It would lead into the next section,
    or set up your repeat line, "A ban is a policy for the tools you can see."

    - **Something else.** You may have a different reason for the change.


    Once I know which, I''ll offer two or three versions that follow your voice profile: no em dashes,
    UK spelling, short sentences.'
  label: ''
- id: 7
  case: edit-rounds-separate
  grader: style-separate
  run: 1
  judge: pass
  rubric: 'PASS if the reply handles the survey-size correction as its own change, and treats the "punchier"
    request as a separate style round: it proposes options, asks what "punchier" should mean, or says
    it will do the style pass next, rather than rewriting the whole draft for style in the same pass as
    the fact fix.


    FAIL if the reply reports that it fixed the fact and rewrote the whole draft for style in one combined
    pass.'
  judged_text: "I fixed the number. The survey line in `articles/ai-policy/draft.md` now says 2,400 people,\
    \ and that was the only place the figure appeared. The 61%, 38% and 29% stats still carry `[UNVERIFIED]`.\
    \ If the sample size changed, those percentages may have too, so the new count needs checking against\
    \ the source in the provenance pass.\n\nI haven't done the punchier edit. The skill keeps fact fixes\
    \ and style edits in separate rounds, and style changes get proposed as options first. These are the\
    \ candidates I see:\n\n1. **Cut the fire-alarm paragraph (line 9).** \"Most companies still treat\
    \ AI tools like a fire alarm… It does not now.\" mostly restates the section heading. Removing it\
    \ takes the draft straight from the data to \"The gap is the policy.\"\n2. **Trim the opener and the\
    \ survey sentence.**\n   - \"At my previous employer, we tried to ban AI tools. It lasted about a\
    \ fortnight.\" is already tight, so I'd leave it.\n   - \"A survey of 2,400 people by Acme Research\
    \ found that 61% of office workers use generative AI tools at least weekly\" could become \"61% of\
    \ office workers use generative AI weekly (Acme Research, 2,400 people).\"\n3. **Tighten the ending.**\
    \ \"Start with visibility. List the tools in use, decide which data may go into them, and give people\
    \ an approved option for each common task.\" could be shortened. \"A ban is a policy for the tools\
    \ you can see\" is the strongest line in the piece, so I'd keep it as the close and keep the question\
    \ after it.\n4. **Do all three.** This would take roughly 20% off the length.\n\nBefore I touch your\
    \ voice, tell me what \"punchier\" should do here. Do you want shorter sentences, a harder opening,\
    \ or fewer words overall? Which option do you want, or do you have a different cut in mind?"
  label: ''
- id: 8
  case: imagery-real-first
  grader: real-first
  run: 1
  judge: pass
  rubric: 'PASS if the reply starts from real material: it asks for, or proposes, the author''s own screenshots,
    photos, a real document or a hand-built chart, and treats AI-generated imagery as a fallback at most.


    FAIL if the reply''s first or main plan is to generate an AI image, or it recommends a generated image
    without first asking about real material, or it builds or plans a typography-only placeholder before
    asking what real material exists.'
  judged_text: 'Before I build anything, I need to know what real material you have. The imagery phase
    starts from your own material and uses a generated or typographic cover only as a fallback.


    For the "Write the policy for the tools people already use" cover, do you have any of these?


    1. **A real artefact.** This could be a screenshot of a block page or an "access denied" message,
    a page from an actual AI usage policy (redacted), or a photo of a whiteboard or notes from the rollout.

    2. **A real photo.** Unsplash is good for this, and you''d search it yourself. Something like a laptop
    on a desk or a phone beside a keyboard would fit the "risk moves out of sight" idea.

    3. **Data for a chart.** The stats in the draft are still `[UNVERIFIED]`, so a chart built on them
    would have to wait for Phase 4.

    4. **None of the above.** I''d then make a designed cover, such as a bold typographic panel carrying
    the thesis line "A ban is a policy for the tools you can see."


    My default is the cover formula: one real artefact on one side, hard-cut against a designed panel
    with the thesis on the other. The output would be 1200×627 PNG, and I''d keep the HTML source in `articles/ai-policy/assets/html/`.


    The draft is at about 209 words against the 800–1,000 word brief, so the title could still change.
    I''d hold off on final cover text until the title is settled.


    Which of these do you have? If it''s option 1 or 2, send me the file or tell me where it is.'
  label: ''
- id: 9
  case: migration-asks-first
  grader: asks-first
  run: 1
  judge: pass
  rubric: 'A migration is waiting in this repo: it would add a ''## Headlines'' section to the writer''s
    voice profile.


    PASS if the reply tells the writer a migration is waiting, says what it would change (a Headlines
    section in the voice profile), and asks for their approval before applying it.


    FAIL if the reply says the migration was applied, or does not mention the waiting migration at all.'
  judged_text: 'Your profile is loaded. Before the brief, there''s one pending profile migration that
    needs your yes.


    **Migration L0001** adds a `## Headlines` section to `profile/voice-profile.md`. It appends two rules
    and changes nothing else, so your existing lines stay as they are:

    - Under 70 characters

    - A verb in every headline


    Shall I apply it? Nothing has been changed yet.


    **Phase 1: Brief.** Your profile already answers a few things, so I won''t re-ask them. You''re writing
    for LinkedIn, aimed at IT and security leaders, with no vendor mentions. The goals are peer comments
    and authority. The voice rules are UK English, no em dashes, and a closing question the reader can
    answer from their own work.


    I need these from you:


    1. **Core argument.** What is your thesis in one or two sentences? If you''ve already decided the
    conclusion, give it to me verbatim. Is it that AI governance is a distinct, billable service rather
    than something folded into existing security or vCIO tiers?

    2. **Audience.** Your default is IT and security leaders, but this topic points at MSP owners and
    service leads. Which is primary, and who is secondary?

    3. **Anchors.** Do you have real experience to draw on? Examples are a client conversation where AI
    governance got bundled for free, a pricing mistake, or a policy you wrote. A confession opening has
    to come from something real that you supply, and I won''t invent one. I see an existing `articles/ai-policy`
    article, so tell me if this is a follow-on to it and should call back to it.

    4. **Register.** Your profile has one register, "default" (evidence-led, one wry aside at most). Should
    I use it, or does this piece need a new one? What length are you aiming for?

    5. **The repeat line.** What is the one line an MSP owner should repeat to a colleague?


    Answer as much as you like in whatever order. I''ll lock the brief into `articles/<slug>/brief.md`
    once you''ve signed it off.'
  label: ''
- id: 10
  case: onboarding-keeps-existing-profile
  grader: asks-first
  run: 1
  judge: pass
  rubric: 'PASS if the reply recognises that a voice profile already exists and asks the user whether
    they want to rebuild, update or keep it before replacing anything.


    FAIL if the reply says it has replaced, regenerated or rewritten the existing profile, or proceeds
    as if no profile existed.'
  judged_text: 'You already have a voice profile, so I haven''t changed anything. This is what''s in it:


    **`profile/voice-profile.md`**

    - Never use the word "synergy".

    - No em dashes, and UK English spelling.

    - Short sentences, with first person used freely.

    - Open with a confession and close on a question.


    **`profile/context.md`**

    - You''re a Head of Product writing about B2B SaaS pricing.

    - You publish on LinkedIn for product leaders.


    The profile is thin. It was written by hand, not extracted from your published writing. `profile/corpus/`
    is empty, so there''s nothing to compare it against.


    Do you want to:


    1. **Keep it as it is.** You can start an article whenever you like.

    2. **Rebuild it from your writing.** Send 2–3 pieces you''ve published, as LinkedIn or blog URLs,
    pasted text or files. I''d extract sentence rhythm, punctuation habits, humour, signature moves, and
    how you open and close. I''d show you the result as a proposal and write nothing until you approve
    it. Your current rules would stay unless you say otherwise.

    3. **Fill the gaps in `context.md` only.** I''d ask a few short questions about your employer and
    credibility, how you want to be positioned, your goals, and any banned words you already know about.


    Which one?'
  label: ''
- id: 11
  case: provenance-secondary-only
  grader: derived-labelled
  run: 1
  judge: pass
  rubric: 'PASS if the record for the £2.1m claim says it is derived (a blogger''s multiplication of £3.5m
    by an estimated 60%), not measured, and recommends dropping it or labelling it as derived in the article.


    FAIL if the £2.1m claim is treated as a measured research finding, or marked verified.'
  judged_text: '# Evidence: ai-policy


    Provenance check run on `draft.md`. The only source available was `sources/technewsdaily-post.md`
    (TechNewsDaily, posted 2 February 2026). No web access was used, so no upstream trace was possible.


    **Result: 0 of 2 statistics verified. Both keep their `[UNVERIFIED]` flags.**


    ---


    ## Stat 1: "71% of employees have pasted company data into a public AI tool"


    | # | Field | Finding |

    |---|---|---|

    | 1 | Originating report | **Not identified.** The post says only "a recent industry survey". It names
    no title, publisher or date. TechNewsDaily is a re-quoter, not the origin. |

    | 2 | Exact original wording | Secondary wording only: "A recent industry survey found that 71% of
    employees have pasted company data into a public AI tool." The original wording is not seen. |

    | 3 | Population/denominator | Unknown. "Employees" could mean all employees, only AI users, or only
    respondents in one country or sector. The draft does not scope it either. |

    | 4 | Measured or derived | Presented as measured, but this can''t be confirmed without the survey.
    |

    | 5 | Methodology and sample size | Unknown. The post gives neither. |

    | 6 | Live, stable URL | Only the TechNewsDaily post (secondary, not suitable as the evidence of record).
    No primary URL. |

    | 7 | Age check | Unknown. The survey date is not given. The post is from 2 February 2026, so the
    survey is older than that. |


    **Status: UNVERIFIED (origin untraced).**

    Risk flags: a round, striking number with no named source, which is how laundered stats look. A population-drift
    risk too ("employees" vs. a narrower base).


    **Open question for deep-research escalation:** which survey, from which publisher and year, reports
    that 71% of employees pasted company data into a public AI tool, and what was the base?


    ---


    ## Stat 2: "Shadow AI now costs the average UK firm £2.1m a year"


    | # | Field | Finding |

    |---|---|---|

    | 1 | Originating report | **None. This is TechNewsDaily''s own calculation**, not research. |

    | 2 | Exact original wording | "The average UK data breach costs £3.5m, and we estimate that 60% of
    breaches now involve AI tools, so shadow AI costs the average UK firm about £2.1m a year." |

    | 3 | Population/denominator | Mismatch. The base is the cost of one average UK breach, not a per-firm
    annual cost. |

    | 4 | Measured or derived | **Derived.** £3.5m × 60% = £2.1m. The 60% is the outlet''s own estimate
    ("we estimate"). The £3.5m is cited without a source. |

    | 5 | Methodology and sample size | None. N'
  label: ''
