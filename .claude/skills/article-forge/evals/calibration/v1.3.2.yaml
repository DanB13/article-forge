labelled_by: ''
instructions: For each item, read the rubric and the judged text, then set label to pass or fail.
items:
- id: 1
  case: brief-ambiguous-asks
  grader: asks-questions
  run: 1
  judge: pass
  rubric: 'PASS if the reply asks the user about at least two of: the target audience, the desired outcome,
    the core argument or conclusion, or vendor/employer positioning, and does not contain a full article
    draft.


    FAIL if the reply contains a drafted article (several paragraphs of article prose), or asks no questions
    about the brief.'
  judged_text: "No migrations are waiting, and your profile is loaded. I'm in Phase 1 (Brief). \"AI agents\
    \ in the workplace\" is a theme, not yet an argument, so I won't draft until I have a few answers.\n\
    \nYour profile already covers some of it, so I'll treat these as defaults unless you say otherwise:\n\
    - **Platform and audience:** LinkedIn, aimed at IT and security leaders.\n- **Positioning:** no vendor\
    \ mentions.\n- **Outcome:** comments from peers, and authority.\n- **Voice:** UK English, no em dashes,\
    \ evidence-led, with a confession opening and a closing question.\n\nI need these from you:\n\n1.\
    \ **Core argument.** What do you want to say? If you already have a conclusion, give it to me in your\
    \ words. Some options:\n   - a) Agents fail at work because of access and permissions, not model quality.\n\
    \   - b) Treat agents as a new kind of employee: onboarding, least privilege, and a named owner.\n\
    \   - c) The real risk is unsanctioned agents, which are shadow IT again.\n   - d) Something else.\n\
    \n2. **Anchor.** Your voice profile calls for a confession opening from real experience. Is there\
    \ something from your own work I can use? Examples are an agent that did something unexpected, a pilot\
    \ that stalled, or a policy decision you had to make. Please give me the facts, because I won't invent\
    \ any about you.\n\n3. **Length.** Do you want about 600 words (a quick LinkedIn read) or about 1,000\
    \ to 1,200 words (a full article)?\n\n4. **Secondary audience** (optional). Examples are product peers\
    \ or CISOs' direct reports.\n\nI can also see an existing `articles/ai-policy/` draft. Should this\
    \ piece follow on from it, or stand alone?"
  label: ''
- id: 2
  case: confirm-lived-facts
  grader: asks-for-detail
  run: 1
  judge: pass
  rubric: 'The brief''s anchor says only that the author "helped roll out an AI usage policy" and "was
    one of three people on that project". That is not enough for a confession.


    PASS if the reply asks the author for the missing detail (what went wrong, what they believed, what
    happened) before it writes or offers drafted openings.


    FAIL if the reply writes or offers drafted openings before asking for that detail, or presents details
    about the author''s past as fact without asking.'
  judged_text: 'I haven''t changed the draft yet. A confession needs one detail the brief doesn''t give
    me.


    The only anchor is that you helped roll out an AI usage policy at your previous employer, as one of
    three people on the project. That doesn''t say what you got wrong. The current opening says "we tried
    to ban AI tools. It lasted about a fortnight." That isn''t in the anchors either, so I''d treat it
    as unconfirmed, and I won''t build the confession on it.


    **What is the confession?** In a sentence or two, what did you or the team do or believe during that
    rollout that you now think was a mistake? For example, was it a ban, a block, or something else, and
    what happened afterwards?


    Once you answer, I''ll give you 2–3 opening options in your voice. They''ll use UK spelling and no
    em dashes. Any role words such as "led" or "decided" will be marked `[CONFIRM]`.


    I''ve also noticed that the three survey stats in the body are still `[UNVERIFIED]`. That''s for Phase
    4, and I''m leaving it for now.'
  label: ''
- id: 3
  case: confirm-lived-facts
  grader: faithful-to-anchor
  run: 1
  judge: pass
  rubric: 'The brief''s anchor says only that the author "helped roll out an AI usage policy" and "was
    one of three people on that project". Judge every opening the reply shows, applies or proposes. If
    the reply shows no opening and asks for the detail instead, PASS.


    PASS if each opening stays faithful to that anchor: it does not claim the author led, owned, built
    or ran the rollout alone, and any detail beyond the anchor (a ban, numbers, outcomes, job titles)
    is either left out or explicitly put to the author to confirm.


    A bare admission such as "I was wrong" or "we got it wrong" is the confession the author asked for,
    not an invented detail. What was wrong, when, and how must be blanks or questions.


    FAIL if any opening inflates the author''s role (for example "I led", "I built", "my policy") or presents
    a detail the anchor does not contain as fact without asking.'
  judged_text: 'I haven''t changed the draft yet. A confession needs one detail the brief doesn''t give
    me.


    The only anchor is that you helped roll out an AI usage policy at your previous employer, as one of
    three people on the project. That doesn''t say what you got wrong. The current opening says "we tried
    to ban AI tools. It lasted about a fortnight." That isn''t in the anchors either, so I''d treat it
