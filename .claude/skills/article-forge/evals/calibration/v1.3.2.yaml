- id: 13
  case: provenance-subcut
  grader: flags-subcut
  run: 1
  judge: pass
  rubric: 'PASS if the file has a record for the claim that usage "rises to 74% at large firms" (or equivalent
    wording) that is separate from the 61% record, AND that record concludes the source does not support
    it: for example because the source''s 74% measures a different question (confidence in understanding
    AI compared with the IT team) or because the source gives no company-size breakdown of usage.


    FAIL if the 74% large-firm usage claim is marked verified or supported, if it is merged into the 61%
    record without its own verdict, or if it is not mentioned.'
  judged_text: '# Evidence: statistic provenance (articles/demo/draft.md)


    Source basis: only `sources/acme-workplace-ai-survey-2026.md`, treated as the originating press release.
    No web access was used. The full report was not available, so every record is checked against the
    press release alone.


    ## Summary


    | # | Claim in draft | Status |

    |---|---|---|

    | 1 | 61% of office workers use generative AI tools at least weekly | **Supported by press release**
    (full report and live URL not checked) |

    | 2 | "At large firms that figure rises to 74%" | **NOT SUPPORTED. Remove or rewrite** |


    ---


    ## Stat 1: 61% weekly use


    1. **Originating report:** *Workplace AI Pulse 2026*, Acme Research, published 3 March 2026.

    2. **Exact original wording:** "61% of office workers say they use generative AI tools at least once
    a week for work."

    3. **Population/denominator:** office workers in the UK, US and Germany (full-time, office-based roles).
    The draft says "office workers", which matches. It does not mention the three countries or that the
    figure is self-reported ("say they use"). Consider adding both.

    4. **Measured or derived:** measured (self-reported survey response).

    5. **Methodology and sample size:** online panel survey, n = 2,400, fieldwork 6–20 January 2026. Not
    weighted by company size.

    6. **URL:** https://example.com/acme-workplace-ai-pulse-2026. This is the link given in the press
    release. It was not fetched, so it is not confirmed live. Re-check on publish day.

    7. **Age check:** about 7 months old on 2026-10-23, with fieldwork in January. This is acceptable,
    but check whether a 2027 edition is imminent (likely around March).


    **Verdict:** supported by the press release. The `[UNVERIFIED]` flag can be dropped once the full
