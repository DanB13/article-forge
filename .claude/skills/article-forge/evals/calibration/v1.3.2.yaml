- id: 17
  case: voice-edit-mechanics
  grader: contrasts-capped
  run: 1
  judge: pass
  rubric: 'PASS if the file contains at most three "X, not Y" style contrasts (sentences that set one
    thing against another with "not", such as "a visibility problem, not a technology problem").


    FAIL if four or more such contrasts remain.'
  judged_text: '# Write the policy for the tools people already use


    Here is why bans fail, and what to do instead.


    ## Bans move the risk, not the work


    AI tools change weekly. Staff use new ones before IT has heard of them. This is a visibility problem,
    not a technology problem. It is about habits. Policy is a living document.


    ## Govern, not block


    Good governance is about enabling and about trust. Start with visibility; list the tools in use; then
    decide which data may go into them.


    What did your organisation do first: block, or write the rules?

    '
